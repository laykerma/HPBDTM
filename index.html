<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chúc Mừng Sinh Nhật - Nguyễn Khắc Mạnh</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030308;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #canvas-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Nút bật/tắt nhạc nhỏ gọn tinh tế góc trên bên phải */
    .audio-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 0, 100, 0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 0, 120, 0.4);
      color: #ff007f;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 999;
      box-shadow: 0 4px 15px rgba(255, 0, 100, 0.3);
      transition: all 0.3s ease;
    }

    .audio-btn:hover {
      transform: scale(1.1);
      background: rgba(255, 0, 100, 0.3);
      border-color: rgba(255, 0, 120, 0.8);
    }

    .audio-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .audio-btn.playing {
      animation: pulse-border 2s infinite;
      color: #ff3399;
      border-color: #ff3399;
    }

    @keyframes pulse-border {
      0% { box-shadow: 0 0 0 0 rgba(255, 51, 153, 0.7); }
      70% { box-shadow: 0 0 0 12px rgba(255, 51, 153, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 51, 153, 0); }
    }
  </style>
</head>
<body>

  <div id="canvas-container">
    <canvas id="bgCanvas"></canvas>
    <canvas id="textCanvas"></canvas>
    <canvas id="fireworkCanvas"></canvas>
  </div>

  <button class="audio-btn" id="musicToggle" title="Bật/Tắt Nhạc">
    <svg id="iconMute" viewBox="0 0 24 24">
      <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27l4.99 4.99H4v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
    </svg>
    <svg id="iconMusic" viewBox="0 0 24 24" style="display: none;">
      <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
    </svg>
  </button>

  <script>
    // ------------------------------------------
    // 1. SYSTEM CANVAS SETUP
    // ------------------------------------------
    const bgCanvas = document.getElementById('bgCanvas');
    const bgCtx = bgCanvas.getContext('2d');

    const textCanvas = document.getElementById('textCanvas');
    const textCtx = textCanvas.getContext('2d');

    const fireworkCanvas = document.getElementById('fireworkCanvas');
    const fireCtx = fireworkCanvas.getContext('2d');

    let w, h;
    function resize() {
      w = window.innerWidth;
      h = window.innerHeight;
      bgCanvas.width = textCanvas.width = fireworkCanvas.width = w;
      bgCanvas.height = textCanvas.height = fireworkCanvas.height = h;
      initMatrix();
    }
    window.addEventListener('resize', resize);

    // ------------------------------------------
    // 2. BACKGROUND MATRIX DIGITAL RAIN EFFECT
    // ------------------------------------------
    const matrixChars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    let fontSize = 16;
    let columns = 0;
    let drops = [];

    function initMatrix() {
      fontSize = w < 600 ? 12 : 16;
      columns = Math.floor(w / fontSize);
      drops = [];
      for (let i = 0; i < columns; i++) {
        drops[i] = Math.random() * -100;
      }
    }

    function drawMatrix() {
      bgCtx.fillStyle = 'rgba(3, 3, 8, 0.15)';
      bgCtx.fillRect(0, 0, w, h);

      bgCtx.fillStyle = 'rgba(255, 0, 100, 0.25)';
      bgCtx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const char = matrixChars[Math.floor(Math.random() * matrixChars.length)];
        const x = i * fontSize;
        const y = drops[i] * fontSize;

        bgCtx.fillText(char, x, y);

        if (y > h && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }

    // ------------------------------------------
    // 3. SMOOTH SCENE & PARTICLE SYSTEM
    // ------------------------------------------
    const scenes = [
      { type: 'text', content: "HAPPY", colors: ["#FF0055", "#FF007F", "#FF3399"] },
      { type: 'text', content: "BIRTHDAY", colors: ["#FF007F", "#FF2A85", "#FF66B2"] },
      { type: 'text', content: "NGUYỄN", colors: ["#FF0055", "#FF007F", "#FF66B2"] },
      { type: 'text', content: "KHẮC", colors: ["#FF007F", "#FF3399", "#FF0055"] },
      { type: 'text', content: "MẠNH", colors: ["#FF0055", "#FF1A75", "#FF66B2"] },
      { type: 'text', content: "21 TUỔI", colors: ["#FF007F", "#FF3399", "#FF0055"] },
      { type: 'cake', content: "CAKE", colors: ["#FF007F", "#FF3399", "#FFCC00", "#00FFCC"] },
      { type: 'text', content: "Chúc bản thân luôn vững vàng,\nnỗ lực hết mình và đạt mọi mục tiêu!", colors: ["#FF0055", "#FF3399", "#FF66B2"] }
    ];

    let currentSceneIdx = 0;
    let particles = [];
    let textState = 'FORMING'; // FORMING, SHIMMER, DISSOLVE
    let stateTimer = 0;

    class Particle {
      constructor(targetX, targetY, colors) {
        this.x = targetX + (Math.random() - 0.5) * w * 0.8;
        this.y = targetY + (Math.random() - 0.5) * h * 0.8;
        this.targetX = targetX;
        this.targetY = targetY;
        
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.size = Math.random() * 0.8 + 1.2;

        this.vx = 0;
        this.vy = 0;
        this.friction = 0.88;
        this.ease = 0.08;

        this.angle = Math.random() * Math.PI * 2;
        this.shimmerSpeed = 0.03 + Math.random() * 0.03;
      }

      update() {
        if (textState === 'FORMING' || textState === 'SHIMMER') {
          const dx = this.targetX - this.x;
          const dy = this.targetY - this.y;

          this.vx += dx * this.ease;
          this.vy += dy * this.ease;
          this.vx *= this.friction;
          this.vy *= this.friction;

          this.x += this.vx;
          this.y += this.vy;

          if (textState === 'SHIMMER') {
            this.angle += this.shimmerSpeed;
            this.x += Math.cos(this.angle) * 0.3;
            this.y += Math.sin(this.angle) * 0.3;
          }
        } else if (textState === 'DISSOLVE') {
          this.x += this.vx;
          this.y += this.vy;
          this.vx *= 0.95;
          this.vy *= 0.95;
          this.size *= 0.96;
        }
      }

      draw(ctx) {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, Math.max(0.1, this.size), 0, Math.PI * 2);
        ctx.fill();
      }

      explode() {
        const angle = Math.random() * Math.PI * 2;
        const force = Math.random() * 12 + 3;
        this.vx = Math.cos(angle) * force;
        this.vy = Math.sin(angle) * force;
      }
    }

    function createCakeParticles(scene) {
      const points = [];
      const centerX = w / 2;
      const centerY = h / 2 + 30;
      const scale = Math.min(w, h) / 700;

      for (let x = -140; x <= 140; x += 5) {
        for (let y = 40; y <= 100; y += 5) {
          points.push({ x: centerX + x * scale, y: centerY + y * scale, color: '#FF007F' });
        }
      }
      for (let x = -100; x <= 100; x += 5) {
        for (let y = -20; y <= 40; y += 5) {
          points.push({ x: centerX + x * scale, y: centerY + y * scale, color: '#FF3399' });
        }
      }
      for (let x = -60; x <= 60; x += 5) {
        for (let y = -70; y <= -20; y += 5) {
          points.push({ x: centerX + x * scale, y: centerY + y * scale, color: '#FF66B2' });
        }
      }
      for (let x = -6; x <= 6; x += 3) {
        for (let y = -120; y <= -70; y += 4) {
          points.push({ x: centerX + x * scale, y: centerY + y * scale, color: '#FFFFFF' });
        }
      }
      for (let i = 0; i < 80; i++) {
        const radius = Math.random() * 12;
        const angle = Math.random() * Math.PI * 2;
        const py = -135 - Math.random() * 20;
        points.push({ 
          x: centerX + (Math.cos(angle) * radius * 0.6) * scale, 
          y: centerY + py * scale, 
          color: Math.random() > 0.3 ? '#FFCC00' : '#FF3300' 
        });
      }

      particles = points.map(pt => new Particle(pt.x, pt.y, [pt.color]));
      textState = 'FORMING';
      stateTimer = 0;
    }

    function createTextParticles(scene) {
      if (scene.type === 'cake') {
        createCakeParticles(scene);
        return;
      }

      const offscreen = document.createElement('canvas');
      const offCtx = offscreen.getContext('2d');
      offscreen.width = w;
      offscreen.height = h;

      const lines = scene.content.split('\n');
      
      // Tự động scale kích thước font dựa theo độ rộng màn hình và chiều dài dòng chữ dài nhất để không bị tràn màn hình
      const maxChars = Math.max(...lines.map(l => l.length));
      let fontSizePx = Math.floor((w * 0.85) / Math.max(maxChars, 5));
      if (w < 600) {
        fontSizePx = Math.floor((w * 0.9) / Math.max(maxChars, 4));
      }
      fontSizePx = Math.min(Math.max(fontSizePx, 18), w < 600 ? 36 : 75);

      offCtx.font = `900 ${fontSizePx}px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
      offCtx.textAlign = 'center';
      offCtx.textBaseline = 'middle';
      offCtx.fillStyle = '#ffffff';

      const lineHeight = fontSizePx * 1.3;
      const totalHeight = lines.length * lineHeight;
      const startY = (h - totalHeight) / 2 + lineHeight / 2;

      lines.forEach((line, i) => {
        offCtx.fillText(line, w / 2, startY + i * lineHeight);
      });

      const imgData = offCtx.getImageData(0, 0, w, h);
      const data = imgData.data;

      const step = w < 600 ? 3 : 4; 
      const newParticles = [];

      for (let y = 0; y < h; y += step) {
        for (let x = 0; x < w; x += step) {
          const index = (y * w + x) * 4;
          if (data[index + 3] > 128) {
            newParticles.push(new Particle(x, y, scene.colors));
          }
        }
      }

      particles = newParticles;
      textState = 'FORMING';
      stateTimer = 0;
    }

    function updateAndDrawText() {
      textCtx.clearRect(0, 0, w, h);
      stateTimer++;

      if (textState === 'FORMING' && stateTimer > 45) {
        textState = 'SHIMMER';
        stateTimer = 0;
      } else if (textState === 'SHIMMER' && stateTimer > (scenes[currentSceneIdx].type === 'cake' ? 140 : (currentSceneIdx === 7 ? 180 : 90))) {
        textState = 'DISSOLVE';
        stateTimer = 0;
        particles.forEach(p => p.explode());
      } else if (textState === 'DISSOLVE' && stateTimer > 35) {
        currentSceneIdx = (currentSceneIdx + 1) % scenes.length;
        createTextParticles(scenes[currentSceneIdx]);
        return;
      }

      textCtx.shadowBlur = textState === 'SHIMMER' ? 12 : 0;
      textCtx.shadowColor = '#ff007f';

      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw(textCtx);
      }
    }

    // ------------------------------------------
    // 4. HUGE 7-COLOR RAINBOW FIREWORKS
    // ------------------------------------------
    let fireworks = [];
    let fireworkParticles = [];

    class Firework {
      constructor() {
        this.x = Math.random() * (w - 100) + 50;
        this.y = h;
        this.targetY = Math.random() * (h * 0.5) + 60;
        this.speed = Math.random() * 3 + 8;
        this.angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.2;
        this.vx = Math.cos(this.angle) * this.speed;
        this.vy = Math.sin(this.angle) * this.speed;
        this.exploded = false;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.08;

        if (this.vy >= 0 || this.y <= this.targetY) {
          this.exploded = true;
          this.explode();
        }
      }

      draw(ctx) {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      explode() {
        const particleCount = 140 + Math.floor(Math.random() * 80);
        for (let i = 0; i < particleCount; i++) {
          fireworkParticles.push(new FireworkParticle(this.x, this.y));
        }
      }
    }

    class FireworkParticle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        
        const rainbowColors = [
          '#FF0000', '#FF7F00', '#FFFF00', '#00FF00', 
          '#00F0FF', '#0044FF', '#9D00FF', '#FF00C8', '#FF3399'
        ];
        this.color = rainbowColors[Math.floor(Math.random() * rainbowColors.length)];

        const angle = Math.random() * Math.PI * 2;
        const force = Math.random() * 12 + 2;

        this.vx = Math.cos(angle) * force;
        this.vy = Math.sin(angle) * force;

        this.friction = 0.94;
        this.gravity = 0.14;
        this.alpha = 1;
        this.decay = Math.random() * 0.012 + 0.007;
      }

      update() {
        this.vx *= this.friction;
        this.vy *= this.friction;
        this.vy += this.gravity;

        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
      }

      draw(ctx) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 2.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function updateAndDrawFireworks() {
      fireCtx.clearRect(0, 0, w, h);

      if (Math.random() < 0.08) {
        fireworks.push(new Firework());
      }

      for (let i = fireworks.length - 1; i >= 0; i--) {
        fireworks[i].update();
        fireworks[i].draw(fireCtx);
        if (fireworks[i].exploded) {
          fireworks.splice(i, 1);
        }
      }

      for (let i = fireworkParticles.length - 1; i >= 0; i--) {
        fireworkParticles[i].update();
        fireworkParticles[i].draw(fireCtx);
        if (fireworkParticles[i].alpha <= 0) {
          fireworkParticles.splice(i, 1);
        }
      }
    }

    // ------------------------------------------
    // 5. AUDIO SYNTHESIZER (HAPPY BIRTHDAY)
    // ------------------------------------------
    let audioCtx = null;
    let isPlaying = false;
    let noteTimeout = null;

    const notes = {
      'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'F4': 349.23, 'G4': 392.00,
      'A4': 440.00, 'B4': 493.88, 'C5': 523.25
    };

    const song = [
      { note: 'C4', duration: 0.4 }, { note: 'C4', duration: 0.4 },
      { note: 'D4', duration: 0.8 }, { note: 'C4', duration: 0.8 },
      { note: 'F4', duration: 0.8 }, { note: 'E4', duration: 1.2 },

      { note: 'C4', duration: 0.4 }, { note: 'C4', duration: 0.4 },
      { note: 'D4', duration: 0.8 }, { note: 'C4', duration: 0.8 },
      { note: 'G4', duration: 0.8 }, { note: 'F4', duration: 1.2 },

      { note: 'C4', duration: 0.4 }, { note: 'C4', duration: 0.4 },
      { note: 'C5', duration: 0.8 }, { note: 'A4', duration: 0.8 },
      { note: 'F4', duration: 0.8 }, { note: 'E4', duration: 0.8 },
      { note: 'D4', duration: 1.2 }
    ];

    let currentNoteIdx = 0;

    function playNote(freq, duration) {
      if (!audioCtx || !isPlaying) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration - 0.05);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playSong() {
      if (!isPlaying) return;

      const current = song[currentNoteIdx];
      playNote(notes[current.note], current.duration);

      currentNoteIdx = (currentNoteIdx + 1) % song.length;
      noteTimeout = setTimeout(playSong, current.duration * 600);
    }

    const musicBtn = document.getElementById('musicToggle');
    const iconMute = document.getElementById('iconMute');
    const iconMusic = document.getElementById('iconMusic');

    musicBtn.addEventListener('click', () => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      isPlaying = !isPlaying;

      if (isPlaying) {
        musicBtn.classList.add('playing');
        iconMute.style.display = 'none';
        iconMusic.style.display = 'block';
        currentNoteIdx = 0;
        playSong();
      } else {
        musicBtn.classList.remove('playing');
        iconMute.style.display = 'block';
        iconMusic.style.display = 'none';
        clearTimeout(noteTimeout);
      }
    });

    // ------------------------------------------
    // 6. MAIN ANIMATION LOOP
    // ------------------------------------------
    function mainLoop() {
      drawMatrix();
      updateAndDrawText();
      updateAndDrawFireworks();
      requestAnimationFrame(mainLoop);
    }

    resize();
    createTextParticles(scenes[0]);
    mainLoop();
  </script>
</body>
</html>
