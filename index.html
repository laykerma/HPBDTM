<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday 3D Clean & Cinematic</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020208;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Lớp màng mờ hiệu ứng chuyển cảnh Cinematic */
        #cinematic-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 100;
            pointer-events: none;
            transition: opacity 2.5s ease-out;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #cinematic-overlay.fade-out {
            opacity: 0;
        }

        /* Thanh đếm thời gian 10s video mode */
        #progress-bar-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            z-index: 90;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff3366, #ffcc00, #33ccff);
            box-shadow: 0 0 10px #ff3366;
        }

        /* Tiêu đề Happy Birthday phía trên */
        #ui-container {
            position: absolute;
            top: 5%;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 1.5s ease-out;
        }

        #ui-container.show {
            opacity: 1;
            transform: translateY(0);
        }

        h1 {
            color: #ff3366;
            font-size: clamp(2.2rem, 6vw, 4rem);
            margin: 0;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255, 51, 102, 0.8), 0 0 40px rgba(255, 51, 102, 0.5);
            animation: glowPulse 1.8s infinite alternate ease-in-out;
        }

        /* Lời chúc dời xuống dưới đáy, không che bánh */
        #wish-container {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1.5s ease-out;
        }

        #wish-container.show {
            opacity: 1;
            transform: translateY(0);
        }

        .wish-card {
            display: inline-block;
            background: rgba(15, 10, 25, 0.7);
            padding: 10px 24px;
            border-radius: 30px;
            border: 1px solid rgba(255, 100, 180, 0.3);
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 32px rgba(255, 51, 102, 0.2);
            max-width: 90%;
        }

        p.wish-text {
            color: #ffffff;
            font-size: clamp(0.95rem, 2.5vw, 1.2rem);
            margin: 0;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        /* Nút đĩa tắt/bật nhạc */
        #music-toggle {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 70px;
            height: 70px;
            background: radial-gradient(circle, #444 40%, #111 100%);
            border: 4px solid #ff3366;
            border-radius: 50%;
            cursor: pointer;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.4);
        }

        #music-toggle:active {
            transform: scale(0.9);
        }

        #music-toggle.playing {
            animation: spin 3s linear infinite;
            box-shadow: 0 0 30px rgba(255, 51, 102, 0.7);
        }

        #music-toggle::before {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            background: #ff3366;
            border-radius: 50%;
            z-index: 2;
        }

        #music-toggle.muted::before {
            background: #666;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes glowPulse {
            0% { transform: scale(1); text-shadow: 0 0 20px rgba(255, 51, 102, 0.8); }
            100% { transform: scale(1.05); text-shadow: 0 0 40px rgba(255, 120, 180, 1); }
        }
    </style>
</head>
<body>

    <div id="cinematic-overlay"></div>
    <div id="progress-bar-container"><div id="progress-bar"></div></div>

    <div id="ui-container">
        <h1>HAPPY BIRTHDAY!</h1>
    </div>

    <div id="wish-container">
        <div class="wish-card">
            <p class="wish-text">Chúc mừng sinh nhật me! Chúc con tuổi mới luôn ngoan ngoãn, hay ăn chóng lớn và ngập tràn niềm vui!</p>
        </div>
    </div>

    <!-- Nút đĩa tắt/bật nhạc -->
    <div id="music-toggle" class="muted" title="Bật/Tắt nhạc"></div>

    <!-- Nhúng thư viện Three.js và OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- 1. SCENE, CAMERA, RENDERER ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020208, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.01;
        controls.minDistance = 5;
        controls.maxDistance = 25;

        // --- 2. HỆ THỐNG ÁNH SÁNG ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const mainSpotLight = new THREE.SpotLight(0xffffff, 1.5);
        mainSpotLight.position.set(0, 20, 10);
        mainSpotLight.angle = Math.PI / 4;
        mainSpotLight.penumbra = 0.8;
        mainSpotLight.castShadow = true;
        scene.add(mainSpotLight);

        const bottomGlowLight = new THREE.PointLight(0xff3366, 3, 15);
        bottomGlowLight.position.set(0, -0.5, 0);
        scene.add(bottomGlowLight);

        // --- 3. DỰNG MÔ HÌNH BÁNH KEM 3D ---
        const cakeGroup = new THREE.Group();

        const floorGeo = new THREE.PlaneGeometry(60, 60);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x050510, roughness: 0.8, metalness: 0.2 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.6;
        floor.receiveShadow = true;
        scene.add(floor);

        const ringGeo = new THREE.RingGeometry(4.8, 5.8, 64);
        const ringMat = new THREE.MeshBasicMaterial({ 
            color: 0xff3399, 
            side: THREE.DoubleSide, 
            transparent: true, 
            opacity: 0.6,
            blending: THREE.AdditiveBlending 
        });
        const magicRing = new THREE.Mesh(ringGeo, ringMat);
        magicRing.rotation.x = -Math.PI / 2;
        magicRing.position.y = -0.55;
        scene.add(magicRing);

        const plateGeo = new THREE.CylinderGeometry(5.2, 5.5, 0.3, 64);
        const plateMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.9, roughness: 0.1 });
        const plate = new THREE.Mesh(plateGeo, plateMat);
        plate.position.y = -0.3;
        plate.receiveShadow = true;
        plate.castShadow = true;
        cakeGroup.add(plate);

        const tier1Geo = new THREE.CylinderGeometry(3.8, 3.8, 2.2, 64);
        const tier1Mat = new THREE.MeshStandardMaterial({ color: 0xff5e87, roughness: 0.3 });
        const tier1 = new THREE.Mesh(tier1Geo, tier1Mat);
        tier1.position.y = 0.95;
        tier1.castShadow = true;
        tier1.receiveShadow = true;
        cakeGroup.add(tier1);

        for (let i = 0; i < 24; i++) {
            const angle = (i / 24) * Math.PI * 2;
            const pearlGeo = new THREE.SphereGeometry(0.18, 16, 16);
            const pearlMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1, metalness: 0.5 });
            const pearl = new THREE.Mesh(pearlGeo, pearlMat);
            pearl.position.set(Math.cos(angle) * 3.85, 0.05, Math.sin(angle) * 3.85);
            cakeGroup.add(pearl);
        }

        const tier2Geo = new THREE.CylinderGeometry(2.4, 2.4, 1.8, 64);
        const tier2Mat = new THREE.MeshStandardMaterial({ color: 0xfff2a1, roughness: 0.3 });
        const tier2 = new THREE.Mesh(tier2Geo, tier2Mat);
        tier2.position.y = 2.85;
        tier2.castShadow = true;
        tier2.receiveShadow = true;
        cakeGroup.add(tier2);

        const frostingGeo = new THREE.TorusGeometry(2.4, 0.22, 16, 64);
        const frostingMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
        const frosting = new THREE.Mesh(frostingGeo, frostingMat);
        frosting.rotation.x = Math.PI / 2;
        frosting.position.y = 3.75;
        cakeGroup.add(frosting);

        const candleGeo = new THREE.CylinderGeometry(0.15, 0.15, 1.6, 32);
        const candleMat = new THREE.MeshStandardMaterial({ color: 0x33ddff, roughness: 0.2 });
        const candle = new THREE.Mesh(candleGeo, candleMat);
        candle.position.y = 4.65;
        candle.name = "candle";
        cakeGroup.add(candle);

        const flameGeo = new THREE.SphereGeometry(0.22, 16, 16);
        flameGeo.scale(1, 2.2, 1);
        const flameMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
        const flame = new THREE.Mesh(flameGeo, flameMat);
        flame.position.y = 5.6;
        flame.name = "flame";
        cakeGroup.add(flame);

        const flameLight = new THREE.PointLight(0xffaa00, 2.5, 8);
        flameLight.position.y = 5.6;
        cakeGroup.add(flameLight);

        scene.add(cakeGroup);

        // --- 4. HỆ THỐNG PHÁO HOA 3D & TƯƠNG TÁC ---
        const fireworks = [];

        function createFireworkExplosion(pos) {
            const particleCount = 80;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const velocities = [];

            const baseColor = new THREE.Color().setHSL(Math.random(), 1, 0.6);

            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] = pos.x;
                positions[i * 3 + 1] = pos.y;
                positions[i * 3 + 2] = pos.z;

                colors[i * 3] = baseColor.r;
                colors[i * 3 + 1] = baseColor.g;
                colors[i * 3 + 2] = baseColor.b;

                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                const speed = 0.15 + Math.random() * 0.2;

                velocities.push(new THREE.Vector3(
                    speed * Math.sin(phi) * Math.cos(theta),
                    speed * Math.sin(phi) * Math.sin(theta),
                    speed * Math.cos(phi)
                ));
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.4,
                vertexColors: true,
                transparent: true,
                opacity: 1,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const pSystem = new THREE.Points(geometry, material);
            scene.add(pSystem);

            fireworks.push({
                system: pSystem,
                velocities: velocities,
                life: 1.0
            });
        }

        // Sao lấp lánh không gian
        const starCount = 500;
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(starCount * 3);
        for(let i=0; i<starCount*3; i+=3){
            starPos[i] = (Math.random() - 0.5) * 40;
            starPos[i+1] = Math.random() * 20;
            starPos[i+2] = (Math.random() - 0.5) * 40;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({ size: 0.25, color: 0xffffff, transparent: true, opacity: 0.8 });
        const starSystem = new THREE.Points(starGeo, starMat);
        scene.add(starSystem);

        // --- 5. ÂM THANH TỰ ĐỘNG PHÁT KHI TƯƠNG TÁC ---
        let audioCtx = null;
        let isPlayingAudio = false;

        function playBirthdayMelody() {
            if (isPlayingAudio) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                isPlayingAudio = true;
                const musicToggle = document.getElementById('music-toggle');
                if (musicToggle) musicToggle.classList.add('playing');
                if (musicToggle) musicToggle.classList.remove('muted');

                const notes = [
                    {f: 264, d: 0.4}, {f: 264, d: 0.4}, {f: 297, d: 0.8}, {f: 264, d: 0.8}, {f: 352, d: 0.8}, {f: 330, d: 1.2},
                    {f: 264, d: 0.4}, {f: 264, d: 0.4}, {f: 297, d: 0.8}, {f: 264, d: 0.8}, {f: 396, d: 0.8}, {f: 352, d: 1.2}
                ];

                let time = audioCtx.currentTime;
                notes.forEach(note => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = note.f;
                    gain.gain.setValueAtTime(0.15, time);
                    gain.gain.exponentialRampToValueAtTime(0.001, time + note.d);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(time);
                    osc.stop(time + note.d);
                    time += note.d + 0.1;
                });

                audioCtx.onstatechange = () => {
                    if (audioCtx.state === 'closed' || audioCtx.state === 'suspended') {
                        isPlayingAudio = false;
                        const mt = document.getElementById('music-toggle');
                        if (mt) { mt.classList.remove('playing'); mt.classList.add('muted'); }
                    }
                };
            } catch (e) {
                console.log(e);
            }
        }

        // Nút đĩa tắt/bật nhạc
        const musicToggle = document.getElementById('music-toggle');
        if (musicToggle) {
            musicToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                if (isPlayingAudio) {
                    // Tắt nhạc
                    if (audioCtx) {
                        audioCtx.close().then(() => {
                            isPlayingAudio = false;
                            musicToggle.classList.remove('playing');
                            musicToggle.classList.add('muted');
                        });
                    }
                } else {
                    // Bật nhạc
                    playBirthdayMelody();
                }
            });
        }

        // --- 6. XỬ LÝ CHUYỂN CẢNH CINEMATIC & TƯƠNG TÁC ---
        let clock = new THREE.Clock();
        const cinematicDuration = 10;
        let isCandleLit = true;

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function handlePointer(event) {
            playBirthdayMelody(); // Tự động bật nhạc khi chạm màn hình lần đầu

            const clientX = event.touches ? event.touches[0].clientX : event.clientX;
            const clientY = event.touches ? event.touches[0].clientY : event.clientY;

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(cakeGroup.children);
            let hitCandle = false;

            for (let obj of intersects) {
                if (obj.object.name === "flame" || obj.object.name === "candle") {
                    isCandleLit = !isCandleLit;
                    flame.visible = isCandleLit;
                    flameLight.visible = isCandleLit;
                    hitCandle = true;
                    break;
                }
            }

            if (!hitCandle) {
                const targetPos = new THREE.Vector3();
                raycaster.ray.at(12, targetPos);
                createFireworkExplosion(targetPos);
            }
        }

        window.addEventListener('click', handlePointer);
        window.addEventListener('touchstart', (e) => { handlePointer(e); }, { passive: true });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        setTimeout(() => {
            document.getElementById('cinematic-overlay').classList.add('fade-out');
        }, 500);

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            if (elapsedTime <= cinematicDuration) {
                const progress = elapsedTime / cinematicDuration;
                const angle = progress * Math.PI * 2 * 0.75;
                const radius = THREE.MathUtils.lerp(22, 11, progress);
                
                camera.position.x = Math.sin(angle) * radius;
                camera.position.z = Math.cos(angle) * radius;
                camera.position.y = THREE.MathUtils.lerp(18, 4, progress);
                camera.lookAt(0, 2, 0);

                document.getElementById('progress-bar').style.width = (progress * 100) + '%';
                
                if (elapsedTime >= 3) {
                    document.getElementById('ui-container').classList.add('show');
                    document.getElementById('wish-container').classList.add('show');
                }
            } else {
                controls.enabled = true;
                controls.update();
                document.getElementById('progress-bar-container').style.opacity = '0';
            }

            cakeGroup.rotation.y = elapsedTime * 0.3;
            magicRing.rotation.z = -elapsedTime * 0.5;

            if (isCandleLit) {
                flame.scale.y = 2.2 + Math.sin(elapsedTime * 18) * 0.3;
                flameLight.intensity = 2.5 + Math.sin(elapsedTime * 25) * 0.6;
            }

            for (let i = fireworks.length - 1; i >= 0; i--) {
                const fw = fireworks[i];
                fw.life -= 0.015;

                const pos = fw.system.geometry.attributes.position.array;
                for (let j = 0; j < fw.velocities.length; j++) {
                    pos[j * 3] += fw.velocities[j].x;
                    pos[j * 3 + 1] += fw.velocities[j].y;
                    pos[j * 3 + 2] += fw.velocities[j].z;
                    fw.velocities[j].y -= 0.003;
                }
                fw.system.geometry.attributes.position.needsUpdate = true;
                fw.system.material.opacity = fw.life;

                if (fw.life <= 0) {
                    scene.remove(fw.system);
                    fireworks.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
